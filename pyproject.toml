[build-system]
requires = ["setuptools>=77"]  # SPDX `license` expression
build-backend = "setuptools.build_meta"

[project]
name = "geo-points-view"
description = "Check whether a distant summit is visible from a point, using the Copernicus DEM, Earth curvature and refraction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [{ name = "Pavel Karpovich" }]
keywords = ["dem", "line-of-sight", "visibility", "terrain", "copernicus", "mountains"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
# no runtime dependencies: the DEM reader and the SVG writer use the standard library only
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
geo-points-view = "geo_points_view.cli:main"

[tool.setuptools.dynamic]
version = { attr = "geo_points_view.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]  # printf-style formatting is used on purpose in the SVG writer
